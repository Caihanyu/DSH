<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: light dark; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      background: #f7f8fa;
      color: #1f2329;
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #1f1f1f; color: #e8e8e8; }
      .spinner { border-color: rgba(255, 255, 255, 0.18) !important; border-top-color: #8aa4ff !important; }
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top-color: #3a55f2;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .message {
      font-size: 13px;
      line-height: 1.7;
      opacity: 0.75;
      white-space: pre-wrap;
      text-align: center;
      max-width: 520px;
      padding: 0 24px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="message" id="message">正在启动 Harness…</div>
  <script>
    const params = new URLSearchParams(location.search);
    const message = params.get('msg');
    if (message) {
      document.getElementById('message').textContent = message;
      if (/失败|超时|错误/.test(message)) {
        document.querySelector('.spinner').style.display = 'none';
      }
    }
  </script>
</body>
</html>
