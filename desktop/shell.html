<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'" />
  <title>DeepSeek Harness</title>
  <style>
    :root {
      --tb-bg: #f7f8fa;
      --tb-fg: #1f2329;
      --tb-border: rgba(0, 0, 0, 0.08);
      --tb-hover: rgba(0, 0, 0, 0.06);
      --tb-active: rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--tb-bg);
      color: var(--tb-fg);
      user-select: none;
      cursor: default;
    }

    #titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
      padding-left: 12px;
      border-bottom: 1px solid var(--tb-border);
      -webkit-app-region: drag;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand img {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      flex: none;
      /* 图标为纯黑鲸鱼,深色主题下自动反色成白色 */
      filter: var(--tb-icon-filter, none);
    }

    .brand-title {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .status {
      font-size: 12px;
      opacity: 0;
      margin-left: 6px;
      white-space: nowrap;
      transition: opacity 0.15s ease;
    }

    .status.visible { opacity: 0.6; }

    .controls {
      display: flex;
      align-items: stretch;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .ctrl {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      cursor: default;
      transition: background 0.12s ease;
    }

    .ctrl:hover { background: var(--tb-hover); }
    .ctrl:active { background: var(--tb-active); }

    .ctrl svg { width: 16px; height: 16px; display: block; }

    #btn-restart {
      width: 42px;
      margin-right: 6px;
      border-radius: 6px;
      align-self: center;
      height: 26px;
    }

    #btn-restart:hover { background: var(--tb-hover); }

    #btn-restart.spinning svg {
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #btn-close:hover { background: #e81123; color: #fff; }
    #btn-close:active { background: #c50f1f; color: #fff; }

    .divider {
      width: 1px;
      margin: 8px 4px;
      background: var(--tb-border);
      -webkit-app-region: no-drag;
    }
  </style>
</head>
<body>
  <header id="titlebar">
    <div class="brand">
      <img src="assets/harness-256.png" alt="DeepSeek Harness" />
      <span class="brand-title">DeepSeek Harness</span>
      <span class="status" id="status"></span>
    </div>

    <div class="controls">
      <button class="ctrl" id="btn-restart" title="重启 Harness(Ctrl+Shift+R)" aria-label="重启 Harness">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13.5 7.2A5.5 5.5 0 1 1 12 3.9" />
          <path d="M13.6 1.8v3.4h-3.4" />
        </svg>
      </button>

      <div class="divider"></div>

      <button class="ctrl" id="btn-minimize" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.1" aria-hidden="true">
          <line x1="2.5" y1="8" x2="13.5" y2="8" />
        </svg>
      </button>

      <button class="ctrl" id="btn-maximize" title="最大化" aria-label="最大化/还原">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true">
          <rect x="3" y="3" width="10" height="10" rx="1" />
        </svg>
      </button>

      <button class="ctrl" id="btn-close" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.1" aria-hidden="true">
          <line x1="4" y1="4" x2="12" y2="12" />
          <line x1="12" y1="4" x2="4" y2="12" />
        </svg>
      </button>
    </div>
  </header>

  <script src="shell.js"></script>
</body>
</html>
