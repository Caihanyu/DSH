# The `minimal-win` agent preset: a fixed-prompt coding-agent composition for
# Windows hosts. `pwsh` replaces the persistent PTY bash (unsupported on win32)
# and pairs with `str_replace_editor` over the preset-local bare filesystem.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a helpful software engineer assistant on a Windows machine.
      Use the `pwsh` tool for shell commands; the persistent `bash` terminal is unavailable on Windows.
      Use `str_replace_editor` to read and edit files; it requires absolute Windows paths such as `D:\some\dir\file.txt`.
    complete: true
    includeRuntimeContext: false

# pwsh runs in a fresh process per call over the host's Windows sandbox
# executor (ctx.shell); there is no PTY or persistent shell state.
- id: pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  config:
    timeoutMs: 300000

# The bare local filesystem shadows the host's sandboxed provider only for this
# preset. The editor shares that realm and requires absolute paths.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000
